<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Yousef, security researcher and builder">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2=".3">
      <stop offset="0" stop-color="#03130d"/><stop offset=".55" stop-color="#0b3b2e"/><stop offset="1" stop-color="#0e4a63"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#3ddc97" stroke-opacity=".09"/>
    </pattern>
    <clipPath id="shape">
      <path d="M0 14 Q0 0 14 0 H1186 Q1200 0 1200 14 V214 C 1010 168, 860 270, 640 228 S 230 176, 0 226 Z"/>
    </clipPath>
    <style>
      .cur { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="1200" height="280" fill="url(#g)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <circle cx="1050" cy="40" r="220" fill="#38bdf8" opacity=".07"/>
  </g>
  <text x="64" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-weight="800" font-size="76" fill="#e6edf3" letter-spacing="1">Yousef<tspan class="cur" fill="#3ddc97">_</tspan></text>
  <text x="68" y="160" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#3ddc97">// security researcher &amp; builder</text>
</svg>
